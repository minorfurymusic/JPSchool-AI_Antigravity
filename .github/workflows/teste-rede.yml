name: Teste de rede (fontes da rotina diaria)
on:
  push:
    branches: [claude/happy-bell-a81nvp]
    paths: [".github/workflows/teste-rede.yml", "estudos/teste_rede.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests==2.34.2
      - run: python3 estudos/teste_rede.py
      - name: Grava o resultado no repositorio
        run: |
          git config user.name "rotina-github"
          git config user.email "actions@users.noreply.github.com"
          git add docs/teste_rede.txt
          git commit -m "Teste de rede do GitHub: resultado" || echo "nada a gravar"
          git push
